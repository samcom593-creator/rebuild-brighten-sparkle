name: Deploy Supabase (functions + migrations)

# Bypasses Lovable's unreliable update pipeline. Pushes deploy only the Edge
# Functions changed by that commit and apply migrations only when migration
# files changed. A manual dispatch with no only_function remains the explicit
# operator-controlled way to redeploy every function.
#
# Required secrets (add once at github.com/<repo>/settings/secrets/actions):
#   SUPABASE_ACCESS_TOKEN   — personal access token for the account that owns
#                             project xrzweoneiieddzxogewk
#                             Get from: https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    — database password (for `db push`)
#                             Get from: project settings → database → connection

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      only_function:
        description: "Deploy only this function (leave blank = deploy all)"
        required: false
        default: ""
      skip_migrations:
        description: "Skip database migrations"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # MP-486. TWO capabilities, TWO scopes, named apart. Collapsing them into
      # one name is what let a functions-scoped PAT pass the credential gate and
      # then 403 on `supabase secrets set` (run 34305246898).
      #   SUPABASE_ACCESS_TOKEN     full PAT: the ONLY one that can set project
      #                             secrets. May legitimately lack that scope;
      #                             that degrades the secrets sync, never the
      #                             function deploy.
      #   SUPABASE_FUNCTIONS_TOKEN  functions-scoped PAT. Falls back to the full
      #                             PAT so a repo without the scoped secret
      #                             behaves exactly as before this change.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_FUNCTIONS_TOKEN: ${{ secrets.SUPABASE_FUNCTIONS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      APEX_BOT_TOKEN:        ${{ secrets.APEX_BOT_TOKEN }}
      PROJECT_REF: xrzweoneiieddzxogewk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight — access token present?
        id: preflight
        run: |
          # Presence only. Either credential is enough to get as far as the
          # capability gate, which is where "present" is turned into "working".
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -z "$SUPABASE_FUNCTIONS_TOKEN" ]; then
            echo "::error::No Supabase PAT secret set — add SUPABASE_ACCESS_TOKEN (or SUPABASE_FUNCTIONS_TOKEN) at repo settings → secrets"
            echo "token_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "token_ok=true" >> "$GITHUB_OUTPUT"


      - name: Sync config.toml with functions/ directory
        id: sync
        run: |
          bash scripts/sync-functions-config.sh
          if ! git diff --quiet supabase/config.toml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::config.toml updated with missing function stanzas"
          fi

      - name: Commit config.toml sync back to main
        if: steps.sync.outputs.changed == 'true' && github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/config.toml
          git commit -m "chore(ci): auto-register new functions in config.toml" || true
          # Rebase + push — tolerate Lovable racing commits
          git pull --rebase origin main || true
          git push || echo "::warning::config.toml sync-back push failed — will retry next run"

      - name: Determine deployment scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_FUNCTION: ${{ inputs.only_function }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$REQUESTED_FUNCTION" ]; then
              if [[ ! "$REQUESTED_FUNCTION" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
                echo "::error::only_function contains unsupported characters"
                exit 1
              fi
              echo "functions=$REQUESTED_FUNCTION" >> "$GITHUB_OUTPUT"
              echo "deploy_all=false" >> "$GITHUB_OUTPUT"
            else
              echo "functions=" >> "$GITHUB_OUTPUT"
              echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            fi
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
            if [ "$SKIP_MIGRATIONS" = "true" ]; then
              echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
            fi
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$GITHUB_SHA"
          fi
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha=$(git rev-parse "$head_sha^")
          fi

          changed_files=$(git diff --name-only "$base_sha" "$head_sha")
          changed_functions=$(printf '%s\n' "$changed_files" \
            | awk -F/ '$1 == "supabase" && $2 == "functions" && NF >= 4 && $3 != "_shared" && $3 != "tests" { print $3 }' \
            | sort -u \
            | tr '\n' ' ' \
            | sed 's/[[:space:]]*$//')

          deploy_all=false
          if printf '%s\n' "$changed_files" | grep -qE '^supabase/functions/_shared/|^supabase/config\.toml$'; then
            # A shared dependency or global function config can affect every
            # bundle. This is the only automatic blanket-deploy case.
            deploy_all=true
          fi
          migrations_changed=false
          if printf '%s\n' "$changed_files" | grep -q '^supabase/migrations/'; then
            migrations_changed=true
          fi
          functions_changed=false
          if [ "$deploy_all" = "true" ] || [ -n "$changed_functions" ]; then
            functions_changed=true
          fi
          deploy_needed=false
          if [ "$functions_changed" = "true" ] || [ "$migrations_changed" = "true" ]; then
            deploy_needed=true
          fi

          echo "functions=$changed_functions" >> "$GITHUB_OUTPUT"
          echo "deploy_all=$deploy_all" >> "$GITHUB_OUTPUT"
          echo "functions_changed=$functions_changed" >> "$GITHUB_OUTPUT"
          echo "migrations_changed=$migrations_changed" >> "$GITHUB_OUTPUT"
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          echo "Functions: ${changed_functions:-none}; all=$deploy_all; migrations=$migrations_changed"

      # MP-476. The Preflight step above proves the secret is NON-EMPTY. That is
      # not the same question as whether it works, and this repo has already paid
      # that bill twice: a heartbeat written before the work it reported on, and
      # a token "proven alive by the deploys that succeed from it daily" that had
      # been 401 for an hour when the sentence was written.
      #
      # SCOPED TO functions_changed ON PURPOSE. Migrations do not touch the
      # management API — `db push` connects to the pooler with
      # SUPABASE_DB_PASSWORD — and migration-only runs have been applying
      # correctly all along with this PAT dead. Failing them here would convert
      # a credential problem into an outage, which is the mistake the audit
      # job's own comment block warns about. So this gate fires only on the runs
      # that genuinely cannot succeed without the PAT.
      - name: Deploy credential ALIVE? (present != working)
        id: cred
        if: steps.scope.outputs.functions_changed == 'true'
        run: |
          set -uo pipefail
          # MP-486. This step used to ask ONE question — "does GET /functions
          # answer 200?" — and print "✓ SUPABASE_ACCESS_TOKEN answers the
          # management API". That sentence was TRUE and INSUFFICIENT: this job
          # spends the credential on TWO capabilities with different
          # privileges, so a functions-scoped PAT passed the gate green and
          # then died one step later on `supabase secrets set`. Proven in run
          # 34305246898: step 7 success, step 9 "your account does not have the
          # necessary privileges". One name, two capabilities.
          #
          # Each capability is now probed against the credential that will
          # actually perform it, and they are graded APART.
          #
          # Asymmetry that keeps this honest: a 401/403 read proves the scope is
          # ABSENT — a real verdict. A 200 read does NOT prove the WRITE will
          # succeed, so it is never treated as a promise; the sync step below
          # still runs for real and still fails hard on a genuine error. The
          # probe may only downgrade a provably-impossible leg, never bless one.
          # (MP-485: absence of evidence is a state, not a verdict.)
          probe() { # $1=bearer token  $2=endpoint  → echoes http code
            local code=""
            for attempt in 1 2 3; do
              code=$(curl -s -o "/tmp/probe-$2.txt" -w '%{http_code}' \
                -H "Authorization: Bearer $1" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/$2" || echo "000")
              case "$code" in
                200|401|403) break ;;  # answered, or a scope verdict that will not improve
              esac
              [ "$attempt" -lt 3 ] && sleep $((attempt*5))
            done
            echo "$code"
          }

          # (a) Can anything deploy a function? Without this the run is dead.
          fn_code=$(probe "$SUPABASE_FUNCTIONS_TOKEN" functions)
          if [ "$fn_code" != "200" ]; then
            echo "::error::No credential can deploy functions — HTTP $fn_code from GET /functions."
            echo "::error::This run changes edge function source, so it cannot succeed."
            echo "::error::Mint a PAT at https://supabase.com/dashboard/account/tokens then:"
            echo "::error::  gh secret set SUPABASE_FUNCTIONS_TOKEN --repo ${{ github.repository }}"
            {
              echo "### Deploy credential: DEAD (HTTP $fn_code)"
              echo "Function deploys cannot run. Migrations are unaffected and still apply."
              echo ""
              echo '```'
              head -c 300 /tmp/probe-functions.txt
              echo ""
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✓ function-deploy capability: HTTP 200 on GET /functions"

          # (b) Can it manage project secrets? Absent scope degrades ONE step.
          # Blocking the deploy here would convert a scope gap into an outage —
          # the mistake this workflow's own audit-job comment warns about.
          sec_code=$(probe "$SUPABASE_ACCESS_TOKEN" secrets)
          if [ "$sec_code" = "200" ]; then
            echo "secrets_capable=true" >> "$GITHUB_OUTPUT"
            echo "✓ project-secrets capability: HTTP 200 on GET /secrets (the WRITE is still proven by doing it)"
          else
            echo "secrets_capable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN cannot manage project secrets (HTTP $sec_code)."
            echo "::warning::Function deploys WILL proceed. What will NOT happen: this run does not"
            echo "::warning::re-push APEX_BOT_TOKEN/BOT_SQL_PERSISTENT_TOKEN into the project."
            echo "::warning::Prod keeps the values it already holds — unchanged, and NOT verified by this run."
            {
              echo "### Project secrets: NOT synced by this run (HTTP $sec_code)"
              echo "\`SUPABASE_ACCESS_TOKEN\` lacks the secrets scope, so \`supabase secrets set\` was skipped."
              echo "Prod retains its existing \`APEX_BOT_TOKEN\`. This run neither changed nor verified it."
              echo "This is reported, not laundered: the step shows as skipped and this line says why."
              echo ""
              echo "To restore syncing, set a full-privilege PAT:"
              echo "\`gh secret set SUPABASE_ACCESS_TOKEN --repo ${{ github.repository }}\`"
            } >> $GITHUB_STEP_SUMMARY
          fi

      - uses: supabase/setup-cli@v1
        if: steps.scope.outputs.deploy_needed == 'true'
        with:
          # Pinning avoids setup-cli's unauthenticated "resolve latest" GitHub
          # API request, which hit the release rate limit on 2026-08-12.
          version: 2.105.0

      # `supabase link` is deliberately GONE. History of this step: it failed
      # silently for 8 days behind continue-on-error (no db password), then the
      # hard-gated version died on a CLI SchemaError parsing this project's
      # api-keys timestamps (2026-08-07, CLI "latest"). Nothing here actually
      # needs link: function deploys use --project-ref + access token, and
      # db push below connects straight to the pooler via --db-url.

      - name: Sync rotated automation credential
        # Runs unless the gate PROVED the scope absent. Still a hard failure
        # when it does run: the gate only skips a known-impossible leg, so a
        # failure here is a real one and must not be swallowed.
        if: steps.scope.outputs.functions_changed == 'true' && steps.cred.outputs.secrets_capable != 'false'
        run: |
          if [ -z "$APEX_BOT_TOKEN" ]; then
            echo "::error::APEX_BOT_TOKEN secret missing — automation credentials cannot be synchronized"
            exit 1
          fi
          supabase secrets set \
            APEX_BOT_TOKEN="$APEX_BOT_TOKEN" \
            BOT_SQL_PERSISTENT_TOKEN="$APEX_BOT_TOKEN" \
            --project-ref "$PROJECT_REF"

      - name: Deploy edge functions
        if: steps.scope.outputs.functions_changed == 'true'
        env:
          CHANGED_FUNCTIONS: ${{ steps.scope.outputs.functions }}
          # The CLI authenticates from SUPABASE_ACCESS_TOKEN, so the
          # functions-scoped credential is bound to that name for THIS step
          # only. Job-level SUPABASE_ACCESS_TOKEN stays the full PAT for the
          # secrets step above.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_FUNCTIONS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        # No blanket --no-verify-jwt. Each function's auth setting is read
        # from supabase/config.toml (where seminar-reminder-tick et al are
        # explicitly verify_jwt=true). If ANY function fails to deploy, the
        # job fails — workflow reporting "success" while functions were
        # silently broken was the Sam-side bug.
        run: |
          set -uo pipefail
          FAIL_COUNT=0
          OK_COUNT=0
          FAILED_FNS=()
          if [ "${{ steps.scope.outputs.deploy_all }}" = "true" ]; then
            echo "→ deploying ALL functions"
            shopt -s nullglob
            cd supabase/functions
            # Bundling pulls imports from esm.sh, which threw 522s for hours on
            # 2026-08-07 and failed whole runs on single transient fetches.
            # 3 attempts with backoff per function turns a CDN blip back into
            # a non-event; a function that fails all 3 still fails the job.
            for dir in */; do
              name="${dir%/}"
              [ "$name" = "_shared" ] && continue
              [ "$name" = "tests" ]   && continue
              echo "── $name ──"
              deployed=false
              for attempt in 1 2 3; do
                if supabase functions deploy "$name" --project-ref "$PROJECT_REF"; then
                  deployed=true
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  echo "::warning::$name attempt $attempt failed — retrying in $((attempt*20))s"
                  sleep $((attempt*20))
                fi
              done
              if [ "$deployed" = true ]; then
                OK_COUNT=$((OK_COUNT+1))
              else
                FAIL_COUNT=$((FAIL_COUNT+1))
                FAILED_FNS+=("$name")
                echo "::error::function $name failed to deploy after 3 attempts"
              fi
            done
          else
            echo "→ deploying changed functions: $CHANGED_FUNCTIONS"
            for name in $CHANGED_FUNCTIONS; do
              echo "── $name ──"
              deployed=false
              for attempt in 1 2 3; do
                if supabase functions deploy "$name" --project-ref "$PROJECT_REF"; then
                  deployed=true
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  echo "::warning::$name attempt $attempt failed — retrying in $((attempt*20))s"
                  sleep $((attempt*20))
                fi
              done
              if [ "$deployed" = true ]; then
                OK_COUNT=$((OK_COUNT+1))
              else
                FAIL_COUNT=$((FAIL_COUNT+1))
                FAILED_FNS+=("$name")
                echo "::error::function $name failed to deploy after 3 attempts"
              fi
            done
          fi
          {
            echo "### Function deploys"
            echo "- ok: $OK_COUNT"
            echo "- failed: $FAIL_COUNT"
            if [ "$FAIL_COUNT" -gt 0 ]; then
              echo "- failed names: ${FAILED_FNS[*]}"
            fi
          } >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::$FAIL_COUNT function(s) failed to deploy: ${FAILED_FNS[*]}"
            exit 1
          fi

      - name: Apply migrations
        # Migrations are not silently skippable. If skip_migrations input is
        # explicitly true (manual override), we skip with a notice. If
        # SUPABASE_DB_PASSWORD is missing the job FAILS so the green-but-
        # didn't-actually-apply mode Sam reported is dead.
        if: steps.scope.outputs.migrations_changed == 'true'
        run: |
          set -uo pipefail
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret missing — migrations cannot apply"
            echo "::error::Add at: github.com/${{ github.repository }}/settings/secrets/actions → New repository secret → SUPABASE_DB_PASSWORD"
            echo "::error::Value lives in: supabase.com → project $PROJECT_REF → Settings → Database → Connection password"
            echo "### Migrations: FAILED — SUPABASE_DB_PASSWORD missing" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # Direct pooler connection — no `supabase link` required (see note at
          # the removed Link step). Password is URL-encoded because it lands in
          # a connection string.
          ENC_PW=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          # aws-1, not aws-0: pooler tenants are sharded per host and this
          # project's tenant answered "not found" on aws-0 (run 2026-08-07T21:58Z)
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@aws-1-us-west-2.pooler.supabase.com:5432/postgres"
          if supabase db push --db-url "$DB_URL" --include-all 2>&1 | tee /tmp/dbpush.log; then
            {
              echo "### Migrations"
              echo "- Applied (or no pending)"
              echo '```'
              tail -30 /tmp/dbpush.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::supabase db push failed — see job log for details"
            tail -50 /tmp/dbpush.log
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Project: \`$PROJECT_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ── MP-423 ────────────────────────────────────────────────────────────────
  # Deliberately its OWN job, not a step in `deploy`.
  #
  # This guard REPORTS on prod; it does not produce it. Gating the deploy on it
  # would mean that a blip reading the management API stops Sam's function code
  # from shipping — converting a monitoring blind spot into an outage. A
  # separate job marks the run red honestly and lets the deploy proceed.
  #
  # NOT `continue-on-error: true`. This repo has already paid that bill: it
  # makes GitHub record a FAILED step's conclusion as "success", which is how a
  # deploy pipeline reported green for 8 days while migrations never applied.
  deployed-source-audit:
    name: Audit — every deployed function has source in this repo
    runs-on: ubuntu-latest
    env:
      # MP-476. Two credentials, two scopes — named apart because conflating
      # them is what left this job blind for 4 days.
      #   SUPABASE_ACCESS_TOKEN    full PAT: deploy + secrets. 401 since
      #                            2026-09-04 (secret rotated that day to a
      #                            value the API rejects). Still the ONLY
      #                            credential the deploy job uses.
      #   SUPABASE_FUNCTIONS_TOKEN functions-scoped PAT. PROVEN 200 on
      #                            GET /v1/projects/<ref>/functions and 200 on
      #                            DELETE; 403 on /secrets, /api-keys,
      #                            /organizations and on listing projects.
      # This guard needs exactly the one endpoint the scoped token answers, so
      # it reads that first. The fallback keeps the job honest if the scoped
      # secret is ever removed: it goes back to the dead PAT and fails loudly
      # rather than skipping, because the script treats an absent token in CI
      # as exit 1.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_FUNCTIONS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xrzweoneiieddzxogewk
    steps:
      - uses: actions/checkout@v4
      - name: Compare prod's ACTIVE function list against supabase/functions/
        run: |
          echo "node $(node --version)"
          node scripts/check-deployed-function-source.mjs
