name: Deploy Supabase (functions + migrations)

# Bypasses Lovable's unreliable update pipeline. Every push to main
# deploys every edge function + applies pending migrations directly via
# the Supabase CLI in ~60 seconds.
#
# Required secrets (add once at github.com/<repo>/settings/secrets/actions):
#   SUPABASE_ACCESS_TOKEN   — personal access token for the account that owns
#                             project msydzhzolwourcdmqxvn
#                             Get from: https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    — database password (for `db push`)
#                             Get from: project settings → database → connection

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      only_function:
        description: "Deploy only this function (leave blank = deploy all)"
        required: false
        default: ""
      skip_migrations:
        description: "Skip database migrations"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: msydzhzolwourcdmqxvn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight — access token present?
        id: preflight
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret missing — add it at repo settings → secrets"
            echo "token_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "token_ok=true" >> "$GITHUB_OUTPUT"

      - name: Sync config.toml with functions/ directory
        id: sync
        run: |
          bash scripts/sync-functions-config.sh
          if ! git diff --quiet supabase/config.toml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::config.toml updated with missing function stanzas"
          fi

      - name: Commit config.toml sync back to main
        if: steps.sync.outputs.changed == 'true' && github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/config.toml
          git commit -m "chore(ci): auto-register new functions in config.toml

Added by scripts/sync-functions-config.sh so Lovable's deploy pipeline
won't skip newly created functions." || true
          # Rebase + push — tolerate Lovable racing commits
          git pull --rebase origin main || true
          git push || echo "::warning::config.toml sync-back push failed — will retry next run"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        continue-on-error: true
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Deploy edge functions
        continue-on-error: true
        run: |
          set +e
          FAIL_COUNT=0
          OK_COUNT=0
          if [ -n "${{ inputs.only_function }}" ]; then
            echo "→ single function: ${{ inputs.only_function }}"
            supabase functions deploy "${{ inputs.only_function }}" \
              --project-ref "$PROJECT_REF" --no-verify-jwt
          else
            echo "→ deploying ALL functions"
            shopt -s nullglob
            cd supabase/functions
            for dir in */; do
              name="${dir%/}"
              [ "$name" = "_shared" ] && continue
              echo "── $name ──"
              if supabase functions deploy "$name" --project-ref "$PROJECT_REF" --no-verify-jwt; then
                OK_COUNT=$((OK_COUNT+1))
              else
                FAIL_COUNT=$((FAIL_COUNT+1))
                echo "::warning::function $name failed to deploy"
              fi
            done
            echo "### Function deploys: $OK_COUNT ok, $FAIL_COUNT failed" >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - name: Apply migrations
        if: ${{ !inputs.skip_migrations }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "⚠ SUPABASE_DB_PASSWORD not set — skipping db push"
            exit 0
          fi
          supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all || {
            echo "db push failed (may be no pending migrations)"
            exit 0
          }

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Project: \`$PROJECT_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
