name: Deploy Supabase (functions + migrations)

# Bypasses Lovable's unreliable update pipeline. Pushes deploy only the Edge
# Functions changed by that commit and apply migrations only when migration
# files changed. A manual dispatch with no only_function remains the explicit
# operator-controlled way to redeploy every function.
#
# Required secrets (add once at github.com/<repo>/settings/secrets/actions):
#   SUPABASE_ACCESS_TOKEN   — personal access token for the account that owns
#                             project xrzweoneiieddzxogewk
#                             Get from: https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    — database password (for `db push`)
#                             Get from: project settings → database → connection

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      only_function:
        description: "Deploy only this function (leave blank = deploy all)"
        required: false
        default: ""
      skip_migrations:
        description: "Skip database migrations"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      APEX_BOT_TOKEN:        ${{ secrets.APEX_BOT_TOKEN }}
      PROJECT_REF: xrzweoneiieddzxogewk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight — access token present?
        id: preflight
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret missing — add it at repo settings → secrets"
            echo "token_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "token_ok=true" >> "$GITHUB_OUTPUT"

      - name: Sync config.toml with functions/ directory
        id: sync
        run: |
          bash scripts/sync-functions-config.sh
          if ! git diff --quiet supabase/config.toml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::config.toml updated with missing function stanzas"
          fi

      - name: Commit config.toml sync back to main
        if: steps.sync.outputs.changed == 'true' && github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/config.toml
          git commit -m "chore(ci): auto-register new functions in config.toml" || true
          # Rebase + push — tolerate Lovable racing commits
          git pull --rebase origin main || true
          git push || echo "::warning::config.toml sync-back push failed — will retry next run"

      - name: Determine deployment scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_FUNCTION: ${{ inputs.only_function }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$REQUESTED_FUNCTION" ]; then
              if [[ ! "$REQUESTED_FUNCTION" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
                echo "::error::only_function contains unsupported characters"
                exit 1
              fi
              echo "functions=$REQUESTED_FUNCTION" >> "$GITHUB_OUTPUT"
              echo "deploy_all=false" >> "$GITHUB_OUTPUT"
            else
              echo "functions=" >> "$GITHUB_OUTPUT"
              echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            fi
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
            if [ "$SKIP_MIGRATIONS" = "true" ]; then
              echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
            fi
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$GITHUB_SHA"
          fi
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha=$(git rev-parse "$head_sha^")
          fi

          changed_files=$(git diff --name-only "$base_sha" "$head_sha")
          changed_functions=$(printf '%s\n' "$changed_files" \
            | awk -F/ '$1 == "supabase" && $2 == "functions" && NF >= 4 && $3 != "_shared" && $3 != "tests" { print $3 }' \
            | sort -u \
            | tr '\n' ' ' \
            | sed 's/[[:space:]]*$//')

          deploy_all=false
          if printf '%s\n' "$changed_files" | grep -qE '^supabase/functions/_shared/|^supabase/config\.toml$'; then
            # A shared dependency or global function config can affect every
            # bundle. This is the only automatic blanket-deploy case.
            deploy_all=true
          fi
          migrations_changed=false
          if printf '%s\n' "$changed_files" | grep -q '^supabase/migrations/'; then
            migrations_changed=true
          fi
          functions_changed=false
          if [ "$deploy_all" = "true" ] || [ -n "$changed_functions" ]; then
            functions_changed=true
          fi
          deploy_needed=false
          if [ "$functions_changed" = "true" ] || [ "$migrations_changed" = "true" ]; then
            deploy_needed=true
          fi

          echo "functions=$changed_functions" >> "$GITHUB_OUTPUT"
          echo "deploy_all=$deploy_all" >> "$GITHUB_OUTPUT"
          echo "functions_changed=$functions_changed" >> "$GITHUB_OUTPUT"
          echo "migrations_changed=$migrations_changed" >> "$GITHUB_OUTPUT"
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          echo "Functions: ${changed_functions:-none}; all=$deploy_all; migrations=$migrations_changed"

      - uses: supabase/setup-cli@v1
        if: steps.scope.outputs.deploy_needed == 'true'
        with:
          # Pinning avoids setup-cli's unauthenticated "resolve latest" GitHub
          # API request, which hit the release rate limit on 2026-08-12.
          version: 2.105.0

      # `supabase link` is deliberately GONE. History of this step: it failed
      # silently for 8 days behind continue-on-error (no db password), then the
      # hard-gated version died on a CLI SchemaError parsing this project's
      # api-keys timestamps (2026-08-07, CLI "latest"). Nothing here actually
      # needs link: function deploys use --project-ref + access token, and
      # db push below connects straight to the pooler via --db-url.

      - name: Sync rotated automation credential
        if: steps.scope.outputs.functions_changed == 'true'
        run: |
          if [ -z "$APEX_BOT_TOKEN" ]; then
            echo "::error::APEX_BOT_TOKEN secret missing — automation credentials cannot be synchronized"
            exit 1
          fi
          supabase secrets set \
            APEX_BOT_TOKEN="$APEX_BOT_TOKEN" \
            BOT_SQL_PERSISTENT_TOKEN="$APEX_BOT_TOKEN" \
            --project-ref "$PROJECT_REF"

      - name: Deploy edge functions
        if: steps.scope.outputs.functions_changed == 'true'
        env:
          CHANGED_FUNCTIONS: ${{ steps.scope.outputs.functions }}
        # No blanket --no-verify-jwt. Each function's auth setting is read
        # from supabase/config.toml (where seminar-reminder-tick et al are
        # explicitly verify_jwt=true). If ANY function fails to deploy, the
        # job fails — workflow reporting "success" while functions were
        # silently broken was the Sam-side bug.
        run: |
          set -uo pipefail
          FAIL_COUNT=0
          OK_COUNT=0
          FAILED_FNS=()
          if [ "${{ steps.scope.outputs.deploy_all }}" = "true" ]; then
            echo "→ deploying ALL functions"
            shopt -s nullglob
            cd supabase/functions
            # Bundling pulls imports from esm.sh, which threw 522s for hours on
            # 2026-08-07 and failed whole runs on single transient fetches.
            # 3 attempts with backoff per function turns a CDN blip back into
            # a non-event; a function that fails all 3 still fails the job.
            for dir in */; do
              name="${dir%/}"
              [ "$name" = "_shared" ] && continue
              [ "$name" = "tests" ]   && continue
              echo "── $name ──"
              deployed=false
              for attempt in 1 2 3; do
                if supabase functions deploy "$name" --project-ref "$PROJECT_REF"; then
                  deployed=true
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  echo "::warning::$name attempt $attempt failed — retrying in $((attempt*20))s"
                  sleep $((attempt*20))
                fi
              done
              if [ "$deployed" = true ]; then
                OK_COUNT=$((OK_COUNT+1))
              else
                FAIL_COUNT=$((FAIL_COUNT+1))
                FAILED_FNS+=("$name")
                echo "::error::function $name failed to deploy after 3 attempts"
              fi
            done
          else
            echo "→ deploying changed functions: $CHANGED_FUNCTIONS"
            for name in $CHANGED_FUNCTIONS; do
              echo "── $name ──"
              deployed=false
              for attempt in 1 2 3; do
                if supabase functions deploy "$name" --project-ref "$PROJECT_REF"; then
                  deployed=true
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  echo "::warning::$name attempt $attempt failed — retrying in $((attempt*20))s"
                  sleep $((attempt*20))
                fi
              done
              if [ "$deployed" = true ]; then
                OK_COUNT=$((OK_COUNT+1))
              else
                FAIL_COUNT=$((FAIL_COUNT+1))
                FAILED_FNS+=("$name")
                echo "::error::function $name failed to deploy after 3 attempts"
              fi
            done
          fi
          {
            echo "### Function deploys"
            echo "- ok: $OK_COUNT"
            echo "- failed: $FAIL_COUNT"
            if [ "$FAIL_COUNT" -gt 0 ]; then
              echo "- failed names: ${FAILED_FNS[*]}"
            fi
          } >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::$FAIL_COUNT function(s) failed to deploy: ${FAILED_FNS[*]}"
            exit 1
          fi

      - name: Apply migrations
        # Migrations are not silently skippable. If skip_migrations input is
        # explicitly true (manual override), we skip with a notice. If
        # SUPABASE_DB_PASSWORD is missing the job FAILS so the green-but-
        # didn't-actually-apply mode Sam reported is dead.
        if: steps.scope.outputs.migrations_changed == 'true'
        run: |
          set -uo pipefail
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret missing — migrations cannot apply"
            echo "::error::Add at: github.com/${{ github.repository }}/settings/secrets/actions → New repository secret → SUPABASE_DB_PASSWORD"
            echo "::error::Value lives in: supabase.com → project $PROJECT_REF → Settings → Database → Connection password"
            echo "### Migrations: FAILED — SUPABASE_DB_PASSWORD missing" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # Direct pooler connection — no `supabase link` required (see note at
          # the removed Link step). Password is URL-encoded because it lands in
          # a connection string.
          ENC_PW=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          # aws-1, not aws-0: pooler tenants are sharded per host and this
          # project's tenant answered "not found" on aws-0 (run 2026-08-07T21:58Z)
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@aws-1-us-west-2.pooler.supabase.com:5432/postgres"
          if supabase db push --db-url "$DB_URL" --include-all 2>&1 | tee /tmp/dbpush.log; then
            {
              echo "### Migrations"
              echo "- Applied (or no pending)"
              echo '```'
              tail -30 /tmp/dbpush.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::supabase db push failed — see job log for details"
            tail -50 /tmp/dbpush.log
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Project: \`$PROJECT_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
