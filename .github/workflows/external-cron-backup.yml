name: External cron backup (pg_cron resilience)

# pg_cron in this Supabase project goes silent every 1-2 days because the
# bgworker dies and only a project Restart brings it back. This workflow is
# our independent heartbeat: every 10 minutes from GitHub's infrastructure
# we hit bot-sql and fire the most critical sync jobs directly. Even if
# pg_cron is dead for 48 hours, the agent-link / deal / lead pipelines
# keep moving.
#
# Required GitHub repo secret:
#   APEX_BOT_TOKEN — Bearer token accepted by the bot-sql edge function.
#                    The persistent fallback ("CLAUDE_PERSISTENT_TOKEN" in
#                    bot-sql's source) is the safe value to use here.

on:
  # GitHub Actions' minimum schedule is 5 minutes per cron entry. Stack five
  # entries staggered by one minute each to get effective ~1-min cadence.
  # If GH delays a run (which it does under load), the next-minute entry
  # picks up the slack so we still get high-frequency syncing.
  # pg_cron jobs in Supabase are ALSO scheduled at "* * * * *" — if Sam
  # toggles the extension off/on, the in-database scheduler will kick in
  # and these external runs become redundant safety nets.
  schedule:
    - cron: '0-59/5 * * * *'   # :00, :05, :10, …
    - cron: '1-59/5 * * * *'   # :01, :06, :11, …
    - cron: '2-59/5 * * * *'   # :02, :07, :12, …
    - cron: '3-59/5 * * * *'   # :03, :08, :13, …
    - cron: '4-59/5 * * * *'   # :04, :09, :14, …
  workflow_dispatch:

# Allow staggered runs to overlap freely. No concurrency group — each
# minute's stagger should fire even if the previous stagger is still
# mid-tick. Previously used ${{ github.event.schedule }} which is
# undefined for workflow_dispatch and broke run dispatch.

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_SQL: https://xrzweoneiieddzxogewk.supabase.co/functions/v1/bot-sql
      BOT_TOKEN: ${{ secrets.APEX_BOT_TOKEN }}
      NTFY: https://ntfy.sh/sams-agent-yrkv9kbqp9e987nb
    steps:
      - name: Preflight — token present?
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::APEX_BOT_TOKEN secret missing — set it in repo Settings → Secrets → Actions"
            exit 1
          fi

      - name: Check pg_cron heartbeat
        id: cron
        run: |
          set -euo pipefail
          # Old version printed "None" when the JSON parse failed and then
          # arithmetic compared "None" -gt 600 (always falsy). Now we coerce
          # any non-numeric result to 99999 so a parse failure is treated as
          # "very stale" — the correct, loud behavior.
          # jq parses the JSON response. If ok=false, rows is empty, or the
          # gap field is missing/non-numeric, we emit 99999 so a stalled
          # cron is treated as "very stale" — the loud behavior. Using jq
          # (not Python heredoc) so the YAML parser doesn't get confused by
          # multi-line indentation inside a pipe block.
          response=$(curl -sS -X POST "$BOT_SQL" \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -H "content-type: application/json" \
            -d '{"query":"SELECT EXTRACT(EPOCH FROM (now()-max(start_time)))::int AS gap FROM cron.job_run_details;"}' || echo '{}')
          gap=$(printf '%s' "$response" | jq -r 'if (.ok == true) and (.rows | length > 0) and (.rows[0].gap | type == "number") then .rows[0].gap else 99999 end' 2>/dev/null || echo 99999)
          # Ensure it's actually an int — defense in depth.
          case "$gap" in
            ''|*[!0-9]*) gap=99999 ;;
          esac
          echo "gap=$gap" >> "$GITHUB_OUTPUT"
          echo "pg_cron gap: ${gap}s"
          if [ "$gap" -gt 600 ]; then
            curl -sS -X POST "$NTFY" \
              -H "Title: pg_cron stalled — external cron firing fallback" \
              -H "Priority: 5" \
              -H "Tags: rotating_light" \
              --data-binary "pg_cron heartbeat is ${gap}s stale. External backup is running critical jobs. Toggle pg_cron extension off/on in Supabase Dashboard when you can." || true
            echo "::warning::pg_cron heartbeat is ${gap}s stale (>600s)"
          fi

      - name: Fire critical jobs
        id: jobs
        run: |
          set -uo pipefail
          # We track success/failure per call and emit a summary. Failures
          # surface as ::warning:: lines so the job-summary section shows
          # them; only critical-path failures fail the workflow.
          FAILED=()
          # fire() = SQL function via bot-sql. Captures both HTTP status and
          # response body so silent timeouts are visible.
          fire() {
            local fn=$1
            local label=$2
            local critical=${3:-no}
            local timeout=${4:-60}
            echo "── $label ──"
            local body status
            body=$(curl -sS -w "\nHTTPSTATUS:%{http_code}" -X POST "$BOT_SQL" \
              -H "Authorization: Bearer $BOT_TOKEN" \
              -H "content-type: application/json" \
              --max-time "$timeout" \
              -d "{\"query\":\"SELECT $fn::text AS r;\"}" 2>&1) || true
            status=$(printf '%s' "$body" | tail -1 | sed 's/HTTPSTATUS://')
            body=$(printf '%s' "$body" | sed '$d')
            echo "$body" | head -c 400
            echo
            if [ "$status" != "200" ] || echo "$body" | grep -q '"ok":false'; then
              echo "::warning::$label failed (status=$status)"
              FAILED+=("$label")
              if [ "$critical" = "yes" ]; then return 1; fi
            fi
          }
          call_edge() {
            local fn=$1
            local body_in=$2
            local critical=${3:-no}
            echo "── edge:$fn ──"
            local resp status
            resp=$(curl -sS -w "\nHTTPSTATUS:%{http_code}" -X POST \
              "https://xrzweoneiieddzxogewk.supabase.co/functions/v1/$fn" \
              -H "Authorization: Bearer $BOT_TOKEN" \
              -H "content-type: application/json" \
              --max-time 90 \
              -d "$body_in" 2>&1) || true
            status=$(printf '%s' "$resp" | tail -1 | sed 's/HTTPSTATUS://')
            resp=$(printf '%s' "$resp" | sed '$d')
            echo "$resp" | head -c 500
            echo
            if [ "$status" != "200" ] || echo "$resp" | grep -qE '"ok":false|"error"'; then
              echo "::warning::edge $fn returned status=$status"
              FAILED+=("edge:$fn")
              if [ "$critical" = "yes" ]; then return 1; fi
            fi
          }
          # SQL watchdog
          fire "public.agentlink_watchdog()" "agentlink-watchdog" no 30 || true
          # AgentLink cookie pull — fetch through Edge Runtime, not pg_net.
          # The Postgres pg_net path can hang on AgentLink's large /api/deals
          # response; the edge function logs to agentlink_sync_log and routes
          # policy-by-policy via upstream userId -> agents.insuracloud_user_id.
          call_edge "agentlink-cookie-sync" '{}' no || true
          # InsuraCloud revival probe — deliberately NOT a per-tick sync.
          # Upstream 404s all three endpoints (/business-analytics,
          # /book-of-business, /team-analytics: "API endpoint not found"), so
          # this call cannot succeed from our side; the dashboards actually
          # ride agentlink-cookie-sync above. Until 2026-08-08 it ran every
          # tick as critical and painted the run red 71 times a day. The fix
          # that day demoted it to non-critical, which stopped the red but left
          # it hammering a dead endpoint 288 times a day and writing ~200 error
          # rows a day into insuracloud_sync_log — the same table whose 465
          # fake-success rows are the reason this repo distrusts the colour
          # green. We still want to know the hour the endpoints come back, so
          # we keep probing, but hourly, and the failure is allowlisted below
          # so it can never colour the run. Re-promote it to a per-tick
          # critical sync only once a probe actually returns ok:true.
          probe_gap=$(curl -sS -X POST "$BOT_SQL" \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -H "content-type: application/json" \
            --max-time 20 \
            -d '{"query":"SELECT COALESCE(EXTRACT(EPOCH FROM (now()-max(created_at)))::int, 99999) AS gap FROM insuracloud_sync_log;"}' 2>/dev/null \
            | jq -r 'if (.ok == true) and (.rows | length > 0) and (.rows[0].gap | type == "number") then .rows[0].gap else 99999 end' 2>/dev/null || echo 99999)
          case "$probe_gap" in ''|*[!0-9]*) probe_gap=99999 ;; esac
          if [ "$probe_gap" -ge 3000 ]; then
            echo "probe: last InsuraCloud attempt ${probe_gap}s ago — probing upstream"
            call_edge "insuracloud-sync" '{"full":false}' no || true
            if ! printf '%s\n' ${FAILED[@]+"${FAILED[@]}"} | grep -qx "edge:insuracloud-sync"; then
              curl -sS -X POST "$NTFY" \
                -H "Title: InsuraCloud endpoints are BACK" \
                -H "Priority: 4" \
                -H "Tags: white_check_mark" \
                --data-binary "insuracloud-sync just returned OK after months of 404s. Re-promote it to a per-tick critical sync in external-cron-backup.yml." || true
            fi
          else
            echo "── edge:insuracloud-sync ── skipped (probed ${probe_gap}s ago; hourly cadence)"
          fi
          # Deal sync queue (stale deal pushes)
          fire "public.deal_sync_queue_promote_dead()" "deal-sync-queue-promote-dead" no 30 || true
          # Auto-assign newly-arrived applications
          fire "public.auto_assign_hiring_manager()" "auto-assign-hiring-manager" no 30 || true
          # Refresh canonical sync-health view used by the dashboard banner.
          fire "public.refresh_sync_health()" "refresh-sync-health" no 10 || true
          # 2026-05-16 INCIDENT: agentlink_mark_stale_deals_cancelled() was
          # marking deals 'cancelled', which tripped trg_fn_deal_status_transition
          # and broadcast retention alerts to Discord naming agents whose
          # deals weren't really cancelled. The function is now a no-op
          # pending a non-status-based stale signal. Do NOT re-enable this
          # line until stale handling moves off the status column.

          # Surface the list of failures to the job summary
          {
            echo "### Cron-tick results"
            if [ "${#FAILED[@]}" -eq 0 ]; then
              echo "- All jobs OK"
            else
              echo "- Failed jobs: ${FAILED[*]}"
              echo "- See per-step logs above for full HTTP responses"
            fi
          } >> $GITHUB_STEP_SUMMARY

          # Honest green. Every call above is non-critical and `|| true`, so
          # without this gate the step CANNOT fail: run 31323354187 on
          # 2026-08-09 had insuracloud-sync return HTTP 502 with {"ok":false}
          # and still reported SUCCESS. That is the fake-success disease living
          # inside the very safety net that exists to catch it. The real danger
          # is not the known-dead upstream — it is that when the bot-sql token
          # died on 2026-08-07, all six calls would have failed and this
          # workflow would still have painted itself green while pg_cron was
          # down and no pipeline moved. A green tick must mean the pipelines
          # actually moved. Only the known-degraded upstream is exempt, and it
          # is named explicitly so the exemption cannot quietly widen.
          # Note the explicit `if` blocks below: `[ test ] && arr+=(x)` returns
          # non-zero when the test is false, and this step runs under GitHub's
          # default `bash -e`, so the terse form would abort the step on the
          # first non-match — the same class of accidental exit that made these
          # runs' colours meaningless in the first place.
          KNOWN_DEGRADED=("edge:insuracloud-sync")
          UNEXPECTED=()
          for f in ${FAILED[@]+"${FAILED[@]}"}; do
            expected=no
            for k in "${KNOWN_DEGRADED[@]}"; do
              if [ "$f" = "$k" ]; then expected=yes; fi
            done
            if [ "$expected" = "no" ]; then UNEXPECTED+=("$f"); fi
          done
          if [ "${#UNEXPECTED[@]}" -gt 0 ]; then
            curl -sS -X POST "$NTFY" \
              -H "Title: External cron backup FAILED" \
              -H "Priority: 5" \
              -H "Tags: rotating_light" \
              --data-binary "Sync jobs failed this tick: ${UNEXPECTED[*]}. pg_cron's backup is not moving the pipelines." || true
            echo "::error::Unexpected sync failures: ${UNEXPECTED[*]}"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### External cron backup"
            echo "- pg_cron gap: ${{ steps.cron.outputs.gap }}s"
            echo "- Fired: agentlink_watchdog, agentlink_live_pull, deal_sync_queue_promote_dead, auto_assign_hiring_manager"
            echo "- Trigger: ${{ github.event_name }}"
          } >> $GITHUB_STEP_SUMMARY
