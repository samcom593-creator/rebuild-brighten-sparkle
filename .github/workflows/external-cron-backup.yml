name: External cron backup (pg_cron resilience)

# WHY THIS EXISTS: pg_cron in this Supabase project was going silent because
# the bgworker died and only a project Restart brought it back. This workflow
# is our independent heartbeat: we hit bot-sql and fire the most critical sync
# jobs directly, so that even if pg_cron is dead for 48 hours the agent-link
# / deal / lead pipelines keep moving.
#
# THAT PREMISE, RE-MEASURED 2026-08-11 — it used to read "goes silent every
# 1-2 days", present tense, undated. It has not been true for any day we can
# observe. Over the FULL retention of cron.job_run_details (2026-06-11 →
# 2026-08-11, 516,985 rows / 50 jobs / 61 days) the five worst gaps between
# consecutive runs are 70/67/67/67/66s, and over 7d / 51,832 samples the
# distribution is p50 0s · p90 60s · p99 60s · max 65s with ZERO gaps > 600s.
# pg_cron has never missed a beat by more than 70 seconds in the observable
# window. Three consequences worth carrying, none of them "delete this file":
#   1. The gap > 600 push in "Check pg_cron heartbeat" below has been
#      unreachable for 61 days — its threshold sits 8.6x above the worst
#      observed gap. It is correctly SILENT, not broken: the query is
#      now()-max(start_time), so a dead bgworker inserts no rows, the gap
#      grows, and it fires. Do not "fix" it by lowering the threshold; 600s
#      is the right bound for a 60s scheduler.
#   2. This used to say every tick fires agentlink-cookie-sync redundantly
#      with a pg_cron that fires it every 60s. By 2026-10-17 pg_cron had no
#      such job, AgentLink had stopped delivering deals, and the leg was
#      retired here (see the Fire-critical-jobs block below).
#   3. The premise may have been true when written; retention starts
#      2026-06-11 and cannot see before it. Re-measure before acting on it —
#      do not inherit this comment's story either. Query:
#        SELECT EXTRACT(EPOCH FROM (start_time - LAG(start_time)
#          OVER (ORDER BY start_time))) FROM (SELECT DISTINCT start_time
#          FROM cron.job_run_details) s;
# A net you delete is deleted the day before you need it. Keeping it.
#
# CADENCE, MEASURED — this header used to claim "every 10 minutes". It is not
# true and the difference is load-bearing for anything that alerts off this
# heartbeat. Over 120 runs / 22.5h: median gap 2.45min, but p90 40.8min and
# max 108.2min, with 34 of 119 gaps over 10 minutes. GitHub Actions schedules
# are best-effort and it drops runs under load. Size staleness bounds against
# the p90/max, never the median.
#
# Required GitHub repo secret:
#   APEX_BOT_TOKEN — Bearer token accepted by the bot-sql edge function.
#                    The persistent fallback ("CLAUDE_PERSISTENT_TOKEN" in
#                    bot-sql's source) is the safe value to use here.

on:
  # GitHub Actions' minimum schedule is 5 minutes per cron entry. Stack five
  # entries staggered by one minute each to get effective ~1-min cadence.
  # If GH delays a run (which it does under load), the next-minute entry
  # picks up the slack so we still get high-frequency syncing.
  # pg_cron jobs in Supabase are ALSO scheduled at "* * * * *" — if Sam
  # toggles the extension off/on, the in-database scheduler will kick in
  # and these external runs become redundant safety nets.
  schedule:
    - cron: '0-59/5 * * * *'   # :00, :05, :10, …
    - cron: '1-59/5 * * * *'   # :01, :06, :11, …
    - cron: '2-59/5 * * * *'   # :02, :07, :12, …
    - cron: '3-59/5 * * * *'   # :03, :08, :13, …
    - cron: '4-59/5 * * * *'   # :04, :09, :14, …
  workflow_dispatch:

# Allow staggered runs to overlap freely. No concurrency group — each
# minute's stagger should fire even if the previous stagger is still
# mid-tick. Previously used ${{ github.event.schedule }} which is
# undefined for workflow_dispatch and broke run dispatch.

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_SQL: https://xrzweoneiieddzxogewk.supabase.co/functions/v1/bot-sql
      BOT_TOKEN: ${{ secrets.APEX_BOT_TOKEN }}
      NTFY: https://ntfy.sh/sams-agent-yrkv9kbqp9e987nb
    steps:
      - name: Preflight — token present?
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::APEX_BOT_TOKEN secret missing — set it in repo Settings → Secrets → Actions"
            exit 1
          fi

      - name: Check pg_cron heartbeat
        id: cron
        run: |
          set -euo pipefail
          # Old version printed "None" when the JSON parse failed and then
          # arithmetic compared "None" -gt 600 (always falsy). Now we coerce
          # any non-numeric result to 99999 so a parse failure is treated as
          # "very stale" — the correct, loud behavior.
          # jq parses the JSON response. If ok=false, rows is empty, or the
          # gap field is missing/non-numeric, we emit 99999 so a stalled
          # cron is treated as "very stale" — the loud behavior. Using jq
          # (not Python heredoc) so the YAML parser doesn't get confused by
          # multi-line indentation inside a pipe block.
          response=$(curl -sS -X POST "$BOT_SQL" \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -H "content-type: application/json" \
            -d '{"query":"SELECT EXTRACT(EPOCH FROM (now()-(SELECT start_time FROM cron.job_run_details ORDER BY runid DESC LIMIT 1)))::int AS gap;"}' || echo '{}')
          gap=$(printf '%s' "$response" | jq -r 'if (.ok == true) and (.rows | length > 0) and (.rows[0].gap | type == "number") then .rows[0].gap else 99999 end' 2>/dev/null || echo 99999)
          # Ensure it's actually an int — defense in depth.
          case "$gap" in
            ''|*[!0-9]*) gap=99999 ;;
          esac
          echo "gap=$gap" >> "$GITHUB_OUTPUT"
          echo "pg_cron gap: ${gap}s"
          if [ "$gap" -gt 600 ]; then
            curl -sS -X POST "$NTFY" \
              -H "Title: pg_cron stalled — external cron firing fallback" \
              -H "Priority: 5" \
              -H "Tags: rotating_light" \
              --data-binary "pg_cron heartbeat is ${gap}s stale. External backup is running critical jobs. Toggle pg_cron extension off/on in Supabase Dashboard when you can." || true
            echo "::warning::pg_cron heartbeat is ${gap}s stale (>600s)"
          fi

      # MP-603: schedule-only in practice (measured: 200/200 runs
      # schedule/main), but workflow_dispatch accepts any ref and this step
      # executes SQL functions and edge functions against prod. Gated so an
      # unmerged branch cannot fire them.
      # MP-604: PROVEN LIVE both directions at headSha 34832dae (identical file):
      #   branch mp604-prove-ref-gate  run 35556870163 — withheld SUCCESS, fire SKIPPED
      #   main                         run 35553219586 — withheld SKIPPED, fire SUCCESS
      # NOTE FOR WHOEVER REPEATS THIS: "Check pg_cron heartbeat" above runs
      # BEFORE this gate and POSTs a priority-5 ntfy push to Sam's phone when the
      # gap exceeds 600s. Measure the gap first (it was 31s) — do not page him to
      # prove a gate.
      - name: Prod write withheld (ref is not main)
        if: github.ref != 'refs/heads/main'
        run: |
          {
            echo "### Critical-job firing withheld"
            echo ""
            echo "Ref \`${{ github.ref }}\` is not \`refs/heads/main\`, so no prod job was fired."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fire critical jobs
        id: jobs
        if: github.ref == 'refs/heads/main'
        run: |
          set -uo pipefail
          # We track success/failure per call and emit a summary. Failures
          # surface as ::warning:: lines so the job-summary section shows
          # them; only critical-path failures fail the workflow.
          FAILED=()
          # fire() = SQL function via bot-sql. Captures both HTTP status and
          # response body so silent timeouts are visible.
          fire() {
            local fn=$1
            local label=$2
            local critical=${3:-no}
            local timeout=${4:-60}
            echo "── $label ──"
            local body status
            body=$(curl -sS -w "\nHTTPSTATUS:%{http_code}" -X POST "$BOT_SQL" \
              -H "Authorization: Bearer $BOT_TOKEN" \
              -H "content-type: application/json" \
              --max-time "$timeout" \
              -d "{\"query\":\"SELECT $fn::text AS r;\"}" 2>&1) || true
            status=$(printf '%s' "$body" | tail -1 | sed 's/HTTPSTATUS://')
            body=$(printf '%s' "$body" | sed '$d')
            echo "$body" | head -c 400
            echo
            if [ "$status" != "200" ] || echo "$body" | grep -q '"ok":false'; then
              echo "::warning::$label failed (status=$status)"
              FAILED+=("$label")
              if [ "$critical" = "yes" ]; then return 1; fi
            fi
          }
          call_edge() {
            local fn=$1
            local body_in=$2
            local critical=${3:-no}
            local timeout=${4:-90}
            echo "── edge:$fn ──"
            local resp status
            resp=$(curl -sS -w "\nHTTPSTATUS:%{http_code}" -X POST \
              "https://xrzweoneiieddzxogewk.supabase.co/functions/v1/$fn" \
              -H "Authorization: Bearer $BOT_TOKEN" \
              -H "content-type: application/json" \
              --max-time "$timeout" \
              -d "$body_in" 2>&1) || true
            status=$(printf '%s' "$resp" | tail -1 | sed 's/HTTPSTATUS://')
            resp=$(printf '%s' "$resp" | sed '$d')
            echo "$resp" | head -c 500
            echo
            if [ "$status" != "200" ] || echo "$resp" | grep -qE '"ok":false|"error"'; then
              echo "::warning::edge $fn returned status=$status"
              FAILED+=("edge:$fn")
              if [ "$critical" = "yes" ]; then return 1; fi
            fi
          }
          # SQL watchdog
          fire "public.agentlink_watchdog()" "agentlink-watchdog" no 30 || true
          # AgentLink cookie sync: RETIRED 2026-10-17 (PL-WIB-CRON-AGENTLINK-RETIRED).
          #
          # This leg is no longer fired. AgentLink stopped delivering deals.
          # Measured in agentlink_sync_log: every successful sync from
          # 2026-09-25 on inserted 0 deals, upstream policies_seen fell from
          # 1734 to 1384 on 10-02 and stayed there, and each sync re-wrote the
          # same 19 rows. The app says the same thing (DashboardToday.tsx:
          # "AgentLink is retired"; Leaderboard.tsx: "AgentLink no longer
          # delivers deals"). pg_cron no longer schedules agentlink-cookie-sync
          # at all (no job, no run in cron.job_run_details), so this tick was
          # the function's only caller, not a backup for one.
          #
          # The session cookie died after the last ok sync at 2026-10-15 18:28Z.
          # Every call since came back 401 Unauthorized, then a Cloudflare 403
          # challenge, and the freshness verdict that lived here called the book
          # stale on every tick: 34 of 34 runs red on 10-16, 40 of 40 on 10-17,
          # each one a priority-5 push. In the 12h that ntfy keeps, 26 of the 55
          # messages on Sam's topic were this alert, on the channel every APEX
          # critical uses. The alert was true and nobody could act on it except
          # by harvesting a cookie for a platform Sam has stopped using.
          #
          # Retired, not allowlisted: an allowlist would keep calling AgentLink
          # with a dead cookie every tick and add ~40 error rows a day to
          # agentlink_sync_log. The freshness verdict (710b27c3, 843c6164,
          # a3fa21b4, c91f82b7, MP-407) is in git history. If AgentLink comes
          # back, harvest a fresh cookie, then restore this block and the old
          # scripts/check-cron-verdict-states.mjs together.
          #
          # The run log still says what was skipped, with the book's measured
          # age, so the retirement is visible on every tick. That read is
          # diagnostic only: it cannot add to FAILED and cannot page.
          al_age=$(curl -sS -X POST "$BOT_SQL" \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -H "content-type: application/json" \
            --max-time 20 \
            -d "{\"query\":\"SELECT COALESCE(EXTRACT(EPOCH FROM (now() - max(COALESCE(l.finished_at, l.started_at))))::int, -1) AS age FROM agentlink_sync_log l WHERE l.status = 'ok';\"}" 2>/dev/null \
            | jq -r 'if (.ok == true) and (.rows | length > 0) and (.rows[0].age | type == "number") then .rows[0].age else empty end' 2>/dev/null || true)
          case "$al_age" in
            ''|*[!0-9-]*) echo "::notice::agentlink-cookie-sync is retired and was not fired. Book age not read this tick (diagnostic only; never colours the run)." ;;
            -1) echo "::notice::agentlink-cookie-sync is retired and was not fired. agentlink_sync_log has no successful sync at all." ;;
            *)
              if [ "$al_age" -le 14400 ]; then
                echo "::notice::agentlink-cookie-sync is retired and was not fired, but something synced AgentLink ${al_age}s ago. If AgentLink is back, restore this leg (see PL-WIB-CRON-AGENTLINK-RETIRED)."
              else
                echo "::notice::agentlink-cookie-sync is retired and was not fired. Last successful AgentLink sync ${al_age}s ago (expected: the book is frozen). This never colours the run."
              fi
              ;;
          esac
          # InsuraCloud revival probe — deliberately NOT a per-tick sync.
          # Upstream 404s all three endpoints (/business-analytics,
          # /book-of-business, /team-analytics: "API endpoint not found"), so
          # this call cannot succeed from our side; the dashboards rode
          # agentlink-cookie-sync until AgentLink was retired, and now read
          # native and Discord-posted deals. Until 2026-08-08 it ran every
          # tick as critical and painted the run red 71 times a day. The fix
          # that day demoted it to non-critical, which stopped the red but left
          # it hammering a dead endpoint 288 times a day and writing ~200 error
          # rows a day into insuracloud_sync_log — the same table whose 465
          # fake-success rows are the reason this repo distrusts the colour
          # green. We still want to know the hour the endpoints come back, so
          # we keep probing, but hourly, and the failure is allowlisted below
          # so it can never colour the run. Re-promote it to a per-tick
          # critical sync only once a probe actually returns ok:true.
          probe_gap=$(curl -sS -X POST "$BOT_SQL" \
            -H "Authorization: Bearer $BOT_TOKEN" \
            -H "content-type: application/json" \
            --max-time 20 \
            -d '{"query":"SELECT COALESCE(EXTRACT(EPOCH FROM (now()-max(created_at)))::int, 99999) AS gap FROM insuracloud_sync_log;"}' 2>/dev/null \
            | jq -r 'if (.ok == true) and (.rows | length > 0) and (.rows[0].gap | type == "number") then .rows[0].gap else 99999 end' 2>/dev/null || echo 99999)
          case "$probe_gap" in ''|*[!0-9]*) probe_gap=99999 ;; esac
          if [ "$probe_gap" -ge 3000 ]; then
            echo "probe: last InsuraCloud attempt ${probe_gap}s ago — probing upstream"
            call_edge "insuracloud-sync" '{"full":false}' no || true
            if ! printf '%s\n' ${FAILED[@]+"${FAILED[@]}"} | grep -qx "edge:insuracloud-sync"; then
              curl -sS -X POST "$NTFY" \
                -H "Title: InsuraCloud endpoints are BACK" \
                -H "Priority: 4" \
                -H "Tags: white_check_mark" \
                --data-binary "insuracloud-sync just returned OK after months of 404s. Re-promote it to a per-tick critical sync in external-cron-backup.yml." || true
            fi
          else
            echo "── edge:insuracloud-sync ── skipped (probed ${probe_gap}s ago; hourly cadence)"
          fi
          # Deal sync queue (stale deal pushes)
          fire "public.deal_sync_queue_promote_dead()" "deal-sync-queue-promote-dead" no 30 || true
          # Auto-assign newly-arrived applications
          fire "public.auto_assign_hiring_manager()" "auto-assign-hiring-manager" no 30 || true
          # Refresh canonical sync-health view used by the dashboard banner.
          # Timeout was 10s. MEASURED 2026-09-04 against prod, three consecutive
          # calls: 12.56s, 27.15s, 0.71s — every one of them HTTP 200. The deadline
          # sat under two of three SUCCESSFUL runs, so curl aborted at 10s, recorded
          # status=000, and turned this whole tick red. This workflow stacks five
          # cron entries for ~1-minute cadence, so each false red mailed Sam roughly
          # every minute; 8,637 of the 16,478 messages in his inbox were GitHub
          # "Run failed" notifications, and this step was a leading contributor.
          # 90s is ~3.3x the observed worst case, not a guess at a round number.
          fire "public.refresh_sync_health()" "refresh-sync-health" no 90 || true
          # 2026-05-16 INCIDENT: agentlink_mark_stale_deals_cancelled() was
          # marking deals 'cancelled', which tripped trg_fn_deal_status_transition
          # and broadcast retention alerts to Discord naming agents whose
          # deals weren't really cancelled. The function is now a no-op
          # pending a non-status-based stale signal. Do NOT re-enable this
          # line until stale handling moves off the status column.

          # Surface the list of failures to the job summary
          {
            echo "### Cron-tick results"
            if [ "${#FAILED[@]}" -eq 0 ]; then
              echo "- All jobs OK"
            else
              echo "- Failed jobs: ${FAILED[*]}"
              echo "- See per-step logs above for full HTTP responses"
            fi
          } >> $GITHUB_STEP_SUMMARY

          # Honest green. Every call above is non-critical and `|| true`, so
          # without this gate the step CANNOT fail: run 31323354187 on
          # 2026-08-09 had insuracloud-sync return HTTP 502 with {"ok":false}
          # and still reported SUCCESS. That is the fake-success disease living
          # inside the very safety net that exists to catch it. The real danger
          # is not the known-dead upstream — it is that when the bot-sql token
          # died on 2026-08-07, all six calls would have failed and this
          # workflow would still have painted itself green while pg_cron was
          # down and no pipeline moved. A green tick must mean the pipelines
          # actually moved. Only the known-degraded upstream is exempt, and it
          # is named explicitly so the exemption cannot quietly widen.
          # Note the explicit `if` blocks below: `[ test ] && arr+=(x)` returns
          # non-zero when the test is false, and this step runs under GitHub's
          # default `bash -e`, so the terse form would abort the step on the
          # first non-match — the same class of accidental exit that made these
          # runs' colours meaningless in the first place.
          KNOWN_DEGRADED=("edge:insuracloud-sync")
          UNEXPECTED=()
          for f in ${FAILED[@]+"${FAILED[@]}"}; do
            expected=no
            for k in "${KNOWN_DEGRADED[@]}"; do
              if [ "$f" = "$k" ]; then expected=yes; fi
            done
            if [ "$expected" = "no" ]; then UNEXPECTED+=("$f"); fi
          done
          if [ "${#UNEXPECTED[@]}" -gt 0 ]; then
            curl -sS -X POST "$NTFY" \
              -H "Title: External cron backup FAILED" \
              -H "Priority: 5" \
              -H "Tags: rotating_light" \
              --data-binary "Sync jobs failed this tick: ${UNEXPECTED[*]}. These calls returned non-200 or ok:false on this tick." || true
            echo "::error::Unexpected sync failures: ${UNEXPECTED[*]}"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### External cron backup"
            echo "- pg_cron gap: ${{ steps.cron.outputs.gap }}s"
            echo "- Fired: agentlink_watchdog, deal_sync_queue_promote_dead, auto_assign_hiring_manager, refresh_sync_health (insuracloud-sync hourly probe; agentlink-cookie-sync retired)"
            echo "- Trigger: ${{ github.event_name }}"
          } >> $GITHUB_STEP_SUMMARY
