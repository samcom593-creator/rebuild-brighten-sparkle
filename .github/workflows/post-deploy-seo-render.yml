name: Post-deploy SEO render

# Fires after Vercel ships. Loads two /careers/<state> recruiting pages in a real
# browser and fails if the Google-for-Jobs payload — per-route <title>, self
# <link rel=canonical>, and the JobPosting JSON-LD with its 5 Google-required
# fields — did not render once the JS ran.
#
# WHY A RENDER CHECK AND NOT A FETCH CHECK. The 10 /careers/* pages exist to claim
# the free Google-for-Jobs SERP slot for "life insurance agent jobs in <state>",
# the highest-intent recruiting query. Their entire SEO payload is injected
# CLIENT-SIDE (useEffect + <JsonLd> on mount); the served HTML is the identical
# SPA shell as the homepage — same bytes, same title, zero JobPosting. Every
# other gate is blind to it: route-smoke (pure fetch, no JS), check-canonical-url
# (static analysis + sitemap parity, not a live render), mobile-overflow (layout
# width), lighthouse (perf score). A refactor that breaks the JsonLd mount or the
# head-injection effect silently kills the rich result AND the per-route canonical
# dedup, and nothing goes red.
#
# Same promotion gate as post-deploy-mobile.yml / post-deploy-smoke.yml: it waits
# for THIS commit to be the live build before probing, so it never tests the
# previous deploy. If prod never serves this commit it does not run and does not
# go red (the deploy failed, or a newer commit promoted ahead and runs its own).
#
# Alerts on the GitHub run page like the sibling post-deploy workflows. It is
# intentionally NOT a timer-fired paging daemon — a deterministic render asserted
# on the exact shipped commit is the right tool; a live prober on a schedule is
# the class with a long false-page history in this system.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-deploy-seo-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # /version.json ({"id": VERCEL_GIT_COMMIT_SHA[0:8]}, written by vite.config.ts)
      # says which build is live. Wait for THIS commit before probing so we never
      # measure the previous deploy. Verbatim from post-deploy-mobile.yml.
      - name: Wait for production to serve this commit
        id: promote
        run: |
          SHORT="$(echo "${{ github.sha }}" | cut -c1-8)"
          DEADLINE=$(( SECONDS + 600 ))
          SERVED=""
          echo "waiting for apex-financial.org to serve ${SHORT}"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            SERVED="$(curl -fsS "https://apex-financial.org/version.json?ci=${GITHUB_RUN_ID}&t=${SECONDS}" \
                      | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)"
            if [ "$SERVED" = "$SHORT" ]; then
              echo "matched=true" >> "$GITHUB_OUTPUT"
              echo "::notice::SEO render is testing build ${SERVED} (= ${{ github.sha }}), live after ${SECONDS}s."
              exit 0
            fi
            sleep 5
          done
          echo "matched=false" >> "$GITHUB_OUTPUT"
          echo "::warning::SEO render did NOT run: production never served ${SHORT} within 600s (last seen '${SERVED:-unreadable}'). Either the deploy did not promote, or a newer commit promoted ahead of this run. This is not a statement about the pages."

      - name: Install deps
        if: steps.promote.outputs.matched == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        if: steps.promote.outputs.matched == 'true'
        run: npx playwright install --with-deps chromium

      # Prove the funnel external-CTA detector still classifies alive/dead/
      # unresolved correctly BEFORE trusting its live verdict below. It launches
      # a browser against its own 127.0.0.1 fixtures (no public network), so it
      # belongs in this Chromium-equipped job, NOT in verify:core — verify:core
      # runs on a cold runner with no browser, where this selftest fails forever
      # with "Executable doesn't exist" and reddens the required gate about the
      # guard's ENVIRONMENT, not the funnel. A broken detector run live would
      # pass dead links or red healthy ones; catching that here keeps the live
      # check honest. Siblings (mobile-overflow / careers-render) keep their
      # selftests local-only; this one is exercised on every promoted deploy.
      - name: Selftest funnel external-CTA detector (fixtures, both directions)
        if: steps.promote.outputs.matched == 'true'
        run: node scripts/check-funnel-external-cta.mjs --selftest

      - name: Run careers JobPosting render check
        if: steps.promote.outputs.matched == 'true'
        run: node scripts/careers-jobposting-render.mjs
        env:
          BASE: https://apex-financial.org

      # Every sitemap URL (minus /careers/*, covered above) must render PUBLIC to an
      # anonymous crawler: no client redirect to /login, no login wall rendered in
      # place, self-canonical. Catches the highest-$ SEO leak route-smoke is blind
      # to — a funnel path (/apply, /vsl, ...) silently becoming a login wall after
      # the JS runs, which would deindex the recruiting funnel. /hall-of-fame proves
      # the shape is live today (200 shell -> client redirect to /login).
      - name: Run sitemap public-render check
        if: steps.promote.outputs.matched == 'true'
        run: node scripts/check-sitemap-public-render.mjs
        env:
          BASE: https://apex-financial.org

      # Follow the links OFF the funnel. The money pages hand every recruit to
      # external partners — Xcel pre-licensing enrollment, the onboarding-call
      # Calendly event, the "how to get licensed" study-guide Google Doc. Those
      # rot on the PARTNER's clock and every other guard asserts only that OUR
      # page is healthy. A bare status check lies here (Xcel 200s with "404" in
      # its JS while rendering a healthy enrollment page), so the probe reads the
      # VISIBLE render. DEFECT (exit 1) fires only on a positively-rendered dead
      # signature with the control up; a transient partner hiccup is UNRESOLVED
      # (exit 3) and is a warning, never a red — a flaky third party must not
      # red Sam's deploy (the false-page lesson). Control-gated so a runner
      # egress blip reads UNKNOWN, not a dead partner.
      - name: Run funnel external-CTA liveness check
        if: steps.promote.outputs.matched == 'true'
        env:
          BASE: https://apex-financial.org
        run: |
          node scripts/check-funnel-external-cta.mjs; code=$?
          if [ "$code" = "3" ]; then
            echo "::warning::funnel external-CTA UNRESOLVED on ${{ github.sha }} — a partner link neither proved alive nor dead (transient status/empty render). Not failing the deploy; re-run to confirm."
            exit 0
          fi
          exit "$code"

      - name: Post failure summary
        if: failure()
        run: |
          echo "::warning::Post-deploy SEO render FAILED on ${{ github.sha }} — the funnel external-CTA DETECTOR selftest failed (the guard's own alive/dead logic regressed, not the site), OR a /careers/* page did not render its Google-for-Jobs payload (per-route title / self-canonical / JobPosting JSON-LD), OR a sitemap URL did not render public to an anonymous crawler (login wall / redirect / wrong canonical), OR the funnel serves a DEAD external onboarding CTA (Xcel enrollment / Calendly / study-guide Doc rendered a page-not-found/access-wall). The Vercel deploy is live; a detector regressed, or a recruiting rich result, funnel URL, or partner handoff did. See the step output above."
