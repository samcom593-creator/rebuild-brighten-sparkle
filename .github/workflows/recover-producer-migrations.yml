name: Recover producer migration deployment

# The approved release stopped at its third migration because agent_status is
# an enum. Apply the reviewed one-expression correction in a temporary copy;
# the Supabase CLI records only migrations it actually applies successfully.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-producer-migrations.yml"
      - ".github/scripts/recover-producer-migrations.mjs"
      - ".github/recovery/producer-migrations-20261124.json"
      - "scripts/tests/producer-migration-recovery.mjs"

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'samcom593-creator/rebuild-brighten-sparkle' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.105.0"
      - name: Validate recovery preparation without credentials
        run: node scripts/tests/producer-migration-recovery.mjs
      - name: Recover and verify the five pending migrations
        if: github.repository == 'samcom593-creator/rebuild-brighten-sparkle' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APEX_BOT_TOKEN: ${{ secrets.APEX_BOT_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node .github/scripts/recover-producer-migrations.mjs
