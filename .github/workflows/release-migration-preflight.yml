name: Verify deployed producer migrations

# Read-only verification of the exact merged main commit and its migration
# history. This workflow publishes no source and performs no database writes.
on:
  push:
    branches: ["codex/producer-release-preflight-20261124"]

permissions:
  contents: read

jobs:
  history:
    if: github.repository == 'samcom593-creator/rebuild-brighten-sparkle' && github.ref == 'refs/heads/codex/producer-release-preflight-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read and verify deployed migration versions
        env:
          APEX_BOT_TOKEN: ${{ secrets.APEX_BOT_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const expectedMain = "c405bf29d5ac14054cac05a5d3cc731271f0abc8";
          const requiredNew = [
            "20261124110000", "20261124111000", "20261124120000",
            "20261124121000", "20261124130000", "20261124131000",
            "20261124140000",
          ];
          const git = (...args) => execFileSync("git", args, {
            encoding: "utf8", timeout: 20000, stdio: ["ignore", "pipe", "pipe"],
          }).trim();
          const fail = (message) => { throw new Error(message); };

          function checkMain() {
            if (git("rev-parse", "refs/remotes/origin/main") !== expectedMain) {
              fail("origin/main differs from the merged release commit; verification cannot proceed.");
            }
            const remoteMain = git("ls-remote", "--exit-code", "origin", "refs/heads/main");
            if (remoteMain !== `${expectedMain}\trefs/heads/main`) {
              fail("Remote main differs from the merged release commit; verification cannot proceed.");
            }
          }

          try {
            if (!/^[a-f0-9]{40}$/.test(expectedMain)) fail("The merged main commit must be pinned before verification.");
            checkMain();

            const token = process.env.APEX_BOT_TOKEN?.trim();
            if (!token) fail("The configured bot-sql credential is unavailable.");

            let response;
            try {
              response = await fetch("https://xrzweoneiieddzxogewk.supabase.co/functions/v1/bot-sql", {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ query: "select coalesce(json_agg(version), '[]'::json) as v from supabase_migrations.schema_migrations" }),
                signal: AbortSignal.timeout(20000),
              });
            } catch {
              fail("The migration-history read failed or exceeded its 20-second timeout.");
            }
            if (!response.ok) fail(`The migration-history read returned HTTP ${response.status}.`);

            let body;
            try { body = await response.json(); }
            catch { fail("The migration-history response was not valid JSON."); }
            const versions = body?.rows?.[0]?.v;
            if (body?.ok !== true || !Array.isArray(body.rows) || body.rows.length !== 1
              || !Array.isArray(versions) || versions.length > 10000
              || !versions.every((v) => typeof v === "string" && /^\d{14}$/.test(v))
              || new Set(versions).size !== versions.length) {
              fail("The migration-history response did not contain a valid bounded version list.");
            }

            const recorded = new Set(versions);
            const files = git("ls-tree", "-r", "--name-only", expectedMain, "--", "supabase/migrations").split("\n");
            const expected = [...new Set(files.map((path) =>
              path.match(/^supabase\/migrations\/(\d{14})_[^/]+\.sql$/)?.[1],
            ).filter(Boolean))].sort();
            if (expected.length === 0 || requiredNew.some((version) => !expected.includes(version))) {
              fail("The merged release commit does not contain all seven required migrations.");
            }
            const missing = expected.filter((version) => !recorded.has(version));
            const missingNew = requiredNew.filter((version) => !recorded.has(version));
            checkMain();

            const checkedAt = new Date().toISOString();
            console.log(`RELEASE_MIGRATION_HISTORY=${JSON.stringify({ main: expectedMain, checked_at: checkedAt, versions: [...recorded].sort() })}`);
            console.log(`Merged versions: ${expected.length}; recorded versions: ${recorded.size}; missing versions: ${missing.length}; required new versions: ${requiredNew.length}; missing new versions: ${missingNew.length}.`);
            if (missing.length) {
              console.error(`Missing versions: ${missing.join(", ")}`);
              fail("Required migrations are unrecorded; deployment verification failed.");
            }
            console.log(`RELEASE_MIGRATION_DEPLOYMENT=${JSON.stringify({ main: expectedMain, checked_at: checkedAt, verified_new_versions: requiredNew, verified_main_version_count: expected.length })}`);
            console.log("Deployed migration-history verification passed. No database writes performed.");
          } catch (error) {
            // Only explicit messages above are exposed; subprocess/network errors
            // and provider response bodies are never printed.
            const allowed = [
              "origin/main differs", "Remote main differs", "The configured bot-sql credential",
              "The migration-history read", "The migration-history response",
              "The merged main commit", "The merged release commit", "Required migrations are unrecorded",
            ];
            const message = error instanceof Error && allowed.some((prefix) => error.message.startsWith(prefix))
              ? error.message : "The read-only deployment verification could not complete; no database writes were attempted.";
            console.error(`::error::${message}`);
            process.exitCode = 1;
          }
          NODE
