name: Verify core checks

# Wave-30 (2026-06-08): server-side mirror of the 5 pre-commit checks +
# tsc + build. Closes the `--no-verify` / parallel-worktree / fresh-clone
# bypass that wave-28 + wave-29 cannot reach.
#
# Why this exists: between wave-29's ship at 03:25Z and wave-30's pickup
# at 04:13Z, 8 commits (e9e37f8a..c9429b77) landed on main without
# triggering the local `.husky/pre-commit` hook — either via different
# worktrees that hadn't run `npm install` (so `prepare` hadn't set
# `core.hooksPath`), or via `git commit --no-verify`. The Vite plugin
# (wave-26/27) catches VSL drift on Vercel build, but the other 4
# guardrails (forbidden-language, metric-truth, sync-reliability,
# unsafe-supabase-catch) had no server-side equivalent.
#
# This workflow re-runs `npm run verify:core` (the same chain wired
# into `.husky/pre-commit`) on every push to main + every PR + every
# manual dispatch. Failure surfaces in GitHub's Actions UI + mobile-app
# notifications, so even a `--no-verify` bypass triggers a visible
# alarm within ~1 minute of push.
#
# Total cost: MEASURED 2026-08-11 — 481-640s (median ~595s) across this
# workflow's last 12 runs. The line here used to claim "~50s on warm cache
# (npm ci ~30s + verify:core ~18s)", which was wrong by ~12x. The same
# understatement lived in scripts/check-tsc-error-count.mjs ("~10-15s") and
# cost a real incident — see the COST note in that file.
#
# Nearly all of it is check:tsc-error-count's `tsc -b --noEmit --force` full
# graph rebuild. That cost is CORRECT to pay here and is deliberately NOT
# reduced: actions/checkout gives a cold clone with no .tsbuildinfo, so there
# is no incremental cache that could report a phantom count. This job is the
# authoritative type-check for the repo.
#
# READ THIS BEFORE NARROWING THIS WORKFLOW.
#
# On 2026-08-11 check:tsc-error-count was REMOVED from .husky/pre-commit — a
# 14.7-minute hook firing on 52.5% of commits was training the operator to
# abandon commits mid-gate, which is how prod and the repo drifted apart that
# day. Incremental was measured too (past 10 min, still going), so there was no
# cheap local answer to keep.
#
# THIS JOB IS NOW THE ONLY TYPE-CHECK IN THE REPO. The root tsconfig.json has
# `files: []`, so `npx tsc --noEmit` exits 0 without checking a single file —
# if this job stops running the check, nothing anywhere goes red and the repo
# silently stops being type-checked.
#
# scripts/check-typecheck-authority.mjs asserts this chain (push+PR triggers →
# verify:core → check:tsc-error-count → --force) and runs in pre-commit
# whenever this file, package.json, or either script is touched.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # MP-421: verify:core now runs the edge-function Deno tests
      # (check:deno-tests). That check FAILS rather than skips when deno is
      # absent -- a test runner that no-ops when its runtime is missing is the
      # guard-run-by-nothing it was written to end -- so this step is
      # load-bearing, not convenience.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # MP-437: the 999-test vitest suite ran in NO workflow until 2026-09-05.
      # `npm test` existed and nothing invoked it — not this file, not the
      # 75-guard verify:core chain (vitest is unreachable by expanding every
      # `npm run` edge from it). MP-436 had shipped four new tests into that
      # suite the day before; nothing would ever have run them.
      #
      # Deliberately its OWN step, ahead of verify:core: it costs ~45s against
      # verify:core's multi-minute chain (check:tsc-error-count alone measures
      # 881s locally), so a broken test reports in under a minute instead of
      # behind the type-checker, and a failure here is attributable on sight
      # rather than buried in a 75-check log.
      #
      # NOT added to the verify:core npm chain on purpose: that chain is what
      # .husky/pre-commit runs, and loading another ~45s onto every local
      # commit is how a gate trains operators to reach for --no-verify. Same
      # reasoning that moved check:tsc-error-count to CI-only on 2026-08-11.
      - name: Run unit tests (vitest, 999 tests / 100 files)
        run: npm test

      - name: Run verify:core (full roster, every failure reported)
        # Mirrors the local pre-commit hook chain so a --no-verify or
        # fresh-clone-without-prepare push still gets caught on origin.
        # MP-456: the non-masking entry. `verify:core` is an && chain, so it
        # stopped at the FIRST red check and left every later one UNRUN while
        # the log named a single cause (26 checks masked across 6 commits on
        # 2026-09-06). verify:core:all runs the SAME roster -- parsed out of
        # verify:core itself, so it cannot drift -- and reports every failure.
        # Graded by check:verify-core-nonmasking; do not revert this to the
        # raw chain, that guard will fail the build if you do.
        run: npm run verify:core:all

      - name: Post failure summary
        if: failure()
        run: |
          echo "::error::verify:core FAILED on ${{ github.sha }}. Read WHICH check failed in the log above before assuming a bypass. If it was check:tsc-error-count, pre-commit could NOT have caught it: since 2026-08-11 the type-check runs ONLY here, because locally it costs 881s (measured) and a 15-minute hook was training operators to abandon commits mid-gate. Reproduce it with 'npm run check:tsc-error-count' and budget ~15 minutes. For any OTHER check in the chain, .husky/pre-commit would have caught it before push if active — confirm core.hooksPath is set to .husky (run 'npm install' once after clone to auto-activate via the prepare script), then re-run that check locally."
