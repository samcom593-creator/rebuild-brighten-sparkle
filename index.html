<!doctype html>

  <head>
    <script>
      // ---- POST-MIGRATION AUTO-CACHE-BUST ----
      // After the 2026-04-30 Supabase migration, any device with a cached
      // service worker or old auth token is locked out with "Invalid login
      // credentials" because requests still route to the dead old project.
      // Also bumped on 2026-05-02 because the CallCenter chunk had a stale
      // copy with the old "assigned_manager_id only" filter still in it,
      // making admins (Sam) see zero leads even after the fix shipped.
      // BUMP_VERSION below — increment whenever a cache-eviction is needed.
      //
      // BUMP_VERSION includes the canonical VSL release date. The build-time
      // VSL sync guard ensures a new cut also evicts stale browser bundles.
      (function() {
        var BUMP_VERSION = "2026-09-02-final-apex-vsl";
        try {
          // ⚠️ NEVER touch the Supabase auth token here. This block used to
          // collect EVERY localStorage key containing the project ref
          // ('xrzweoneiieddzxogewk') as "stale" — which includes the LIVE
          // 'sb-...-auth-token' — and delete them whenever any were present on a
          // fresh tab (`hadStaleAuth`). That logged every signed-in agent out on
          // their first reload/navigation and bounced them to /login. The fresh
          // bundle never required a fresh session. Now we ONLY evict the service
          // worker + caches on an actual build-version change, and leave auth alone.
          var seenBump = localStorage.getItem('apex_bump_version');
          // A first-time visitor has no cache to evict. Reloading that visitor
          // doubled the initial document request and made the site feel slow
          // before React even started. Only reload an existing installation
          // whose recorded build is genuinely stale.
          var isExistingInstall = seenBump !== null;
          var needsBump = isExistingInstall && seenBump !== BUMP_VERSION;
          if (!isExistingInstall) {
            localStorage.setItem('apex_bump_version', BUMP_VERSION);
          }
          if (needsBump && !sessionStorage.getItem('apex_cache_busted')) {
            sessionStorage.setItem('apex_cache_busted', '1');
            localStorage.setItem('apex_bump_version', BUMP_VERSION);
            // Evict the stale bundle only — NOT the session.
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            if (typeof caches !== 'undefined') {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            // 2026-06-15 v7.13 · auto-reload on BUMP_VERSION change so the fresh
            // bundle lands within one page load — the SW + caches were nuked
            // above, so without a reload the page would keep serving the old
            // bundle until the next navigation. Signed-in users stay signed in.
            location.replace(location.pathname + (location.search ? location.search + '&' : '?') + '_freshv=' + Date.now());
          }
        } catch (e) { /* swallow — never block page on cache-bust */ }
      })();
    </script>
    <script>
      // Theme bootstrap. Dark remains the DEFAULT — this only stops dark being
      // FORCED over a saved light preference.
      //
      // History: locked to dark 2026-05-17 because light broke text contrast
      // everywhere. The shared UI + layout primitives were repaired on
      // 2026-08-23 (0f998851), so the lock is lifted; dark still wins whenever
      // nothing is saved, so the default look is unchanged for everyone.
      //
      // Two defects in the locked version, both fixed here: it wrote key
      // 'theme', which NOTHING in the codebase reads (the live key is
      // 'apex:theme:v2'), and it force-added `dark` at parse time so a
      // light-mode user got a dark first paint until React corrected it.
      // Touches ONLY the theme class + theme key — never auth storage
      // (the 2026-08-04 session-wipe bug came from bootstrap touching auth).
      (function() {
        var root = document.documentElement;
        var t = null;
        try { t = localStorage.getItem('apex:theme:v2'); } catch (e) {}
        // Public marketing / funnel / brand surfaces are ALWAYS the brand dark
        // theme (#0A0A0A), regardless of a persisted light preference. Light
        // mode is a deliberately-kept ADMIN-only toggle (TopBar inside
        // AuthenticatedShell) whose tokens are known-broken — measured
        // 2026-11-20 at 136 WCAG contrast failures on `/` in light (invisible
        // headlines + CTAs). A cold prospect never has a stored preference, so
        // this is a no-op for them (already dark); it enforces the brand
        // invariant for any internal user who toggled light and then opened a
        // public page, and makes "public site is the dark brand" structurally
        // true. The app shell still honors the toggle — this only pins the
        // public conversion/brand routes. Guard: scripts/check-public-theme-pin.mjs.
        var PUBLIC_DARK = /^\/(apply|vsl|schedule-call|get-licensed|leads|get-leads|dialer|contact|storefront|careers)(\/|$)/;
        var p = location.pathname;
        var forceDark = p === '/' || PUBLIC_DARK.test(p);
        root.classList.remove('light', 'dark');
        root.classList.add(t === 'light' && !forceDark ? 'light' : 'dark');
      })();
    </script>

    <!-- wave-33 (2026-06-08): Self-hosted variable fonts. Was: external Google
         Fonts CSS at fonts.googleapis.com + woff2 files at fonts.gstatic.com.
         That setup forced (1) two cross-origin DNS+TLS handshakes even with
         preconnect, (2) a render-blocking external stylesheet fetch before
         FCP could fire, (3) chained-request waterfall (CSS → discover font URL
         → fetch font). Now: 2 same-origin variable-font woff2 files (DM Sans
         covers weights 400+500 from a single 36 KB woff2; Syne covers 700+800
         from a single 34 KB woff2 — both are variable fonts on the weight
         axis, so one file serves both weights). @font-face rules inline below
         so the browser can parse them as part of the HTML stream without a
         second roundtrip. Preload tags discover the woff2 URLs before the
         <style> block parses. Projected: -150-300ms FCP, -100-250ms LCP on
         mobile per Lighthouse Critical-Path (eliminates the render-blocking
         external stylesheet from the critical path). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/hanken-grotesk.woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Hanken Grotesk';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/hanken-grotesk.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    
    <!-- Supabase Preconnect -->
    <link rel="preconnect" href="https://xrzweoneiieddzxogewk.supabase.co" />
    <link rel="dns-prefetch" href="https://xrzweoneiieddzxogewk.supabase.co" />

    <!-- The native player lives on /vsl only. Its no-cors poster preload
         must not consume bandwidth on the two-choice homepage or app routes. -->
    <script>
      (function() {
        var p = location.pathname.replace(/\/+$/, '') || '/';
        if (p !== '/vsl') return;
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.setAttribute('fetchpriority', 'high');
        l.href = "https://xrzweoneiieddzxogewk.supabase.co/storage/v1/object/public/training-videos/vsl/2026-09-02/galaxy-vsl-poster.jpg";
        document.head.appendChild(l);
      })();
    </script>
