    <script>
      // ---- POST-MIGRATION AUTO-CACHE-BUST ----
      // After the 2026-04-30 Supabase migration, any device with a cached
      // service worker or old auth token is locked out with "Invalid login
      // credentials" because requests still route to the dead old project.
      // Also bumped on 2026-05-02 because the CallCenter chunk had a stale
      // copy with the old "assigned_manager_id only" filter still in it,
      // making admins (Sam) see zero leads even after the fix shipped.
      // BUMP_VERSION below — increment whenever a cache-eviction is needed.
      //
      // wave-27 (2026-06-07) CONVENTION: BUMP_VERSION MUST contain the
      // current HeroSection.tsx LazyYouTube videoId as a substring. Enforced
      // by vite.config.ts `vslSyncCheckPlugin` at buildStart — any build
      // where BUMP_VERSION drifts from the canonical videoId will fail.
      // This is the third drift surface that wave-25's preload drift
      // exposed: if Sam swaps the VSL but only updates HeroSection +
      // preload + JSON-LD (wave-26 covers those), pinned service workers
      // on returning visitors continue serving the prior bundle's view —
      // so BUMP_VERSION must also change. Embedding the videoId makes
      // that mechanical: the build can't ship without a bump.
      (function() {
        var BUMP_VERSION = "2026-06-10-v12-wave-63-bg-gradient-ratchet-down-E2VJ1v85IRE";
        try {
          var staleKeys = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('xrzweoneiieddzxogewk') !== -1) staleKeys.push(k);
          }
          var seenBump = localStorage.getItem('apex_bump_version');
          var hadStaleAuth = staleKeys.length > 0 && !sessionStorage.getItem('apex_cache_busted');
          var needsBump = seenBump !== BUMP_VERSION;
          if (hadStaleAuth || needsBump) {
            sessionStorage.setItem('apex_cache_busted', '1');
            localStorage.setItem('apex_bump_version', BUMP_VERSION);
            staleKeys.forEach(function(k) { localStorage.removeItem(k); });
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            if (typeof caches !== 'undefined') {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            // Only auto-reload on the migration case (preserves intent of
            // original script). Bump-only updates take effect next visit
            // because the SW/caches are cleared but page already loaded.
            if (hadStaleAuth) {
              location.replace(location.pathname + (location.search ? location.search + '&' : '?') + '_freshv=' + Date.now());
            }
          }
        } catch (e) { /* swallow — never block page on cache-bust */ }
      })();
    </script>

        root.classList.remove('light');
        root.classList.add('dark');
        try { localStorage.setItem('theme', 'dark'); } catch (e) {}
      })();
    </script>

    <!-- wave-33 (2026-06-08): Self-hosted variable fonts. Was: external Google
         Fonts CSS at fonts.googleapis.com + woff2 files at fonts.gstatic.com.
         That setup forced (1) two cross-origin DNS+TLS handshakes even with
         preconnect, (2) a render-blocking external stylesheet fetch before
         FCP could fire, (3) chained-request waterfall (CSS → discover font URL
         → fetch font). Now: 2 same-origin variable-font woff2 files (DM Sans
         covers weights 400+500 from a single 36 KB woff2; Syne covers 700+800
         from a single 34 KB woff2 — both are variable fonts on the weight
         axis, so one file serves both weights). @font-face rules inline below
         so the browser can parse them as part of the HTML stream without a
         second roundtrip. Preload tags discover the woff2 URLs before the
         <style> block parses. Projected: -150-300ms FCP, -100-250ms LCP on
         mobile per Lighthouse Critical-Path (eliminates the render-blocking
         external stylesheet from the critical path). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/syne.woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url('/fonts/dm-sans.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 700 800;
        font-display: swap;
        src: url('/fonts/syne.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
