<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Link-share card (og:image / twitter:image). Rendered to galaxy-recruiting-20261126.jpg by
       scripts/render-share-card.mjs; check:share-card fails if this file changes without a
       re-render, or if #wordmark stops matching platformName in src/config/brand.ts. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#171012"/>
      <stop offset="100%" stop-color="#270b10"/>
    </linearGradient>
    <linearGradient id="brand-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef3340"/>
      <stop offset="50%" stop-color="#e31b2b"/>
      <stop offset="100%" stop-color="#bc1423"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0%" stop-color="#ef3340" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ef3340" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text id="wordmark" x="600" y="175" font-family="Syne, sans-serif" font-weight="800" font-size="112" fill="#ffffff" text-anchor="middle" letter-spacing="8">GALAXY</text>
  <text x="600" y="236" font-family="Hanken Grotesk, sans-serif" font-weight="700" font-size="38" fill="#ef3340" text-anchor="middle" letter-spacing="14">FINANCIAL</text>

  <text x="600" y="330" font-family="Hanken Grotesk, sans-serif" font-weight="800" font-size="52" fill="#ffffff" text-anchor="middle">WHERE WINNING</text>
  <text x="600" y="390" font-family="Hanken Grotesk, sans-serif" font-weight="800" font-size="52" fill="#ffffff" text-anchor="middle">AGENCIES ARE BUILT.</text>
  <text x="600" y="438" font-family="Hanken Grotesk, sans-serif" font-weight="400" font-size="26" fill="#d4d4d8" text-anchor="middle">Licensed producer or future agent? Choose your path.</text>

  <rect id="cta-pill" x="320" y="474" width="560" height="76" rx="12" fill="url(#brand-red)"/>
  <text id="cta-text" x="600" y="523" font-family="Hanken Grotesk, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">GALAXYFINANCIAL.ORG</text>

  <text x="600" y="599" font-family="Hanken Grotesk, sans-serif" font-weight="500" font-size="18" fill="#a1a1aa" text-anchor="middle" letter-spacing="2">TRAINING · CARRIER ACCESS · TEAM SUPPORT</text>
</svg>
