<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Link-share card (og:image / twitter:image). Rendered to galaxy-recruit-og.jpg by
       scripts/render-share-card.mjs; check:share-card fails if this file changes without a
       re-render, or if #wordmark stops matching platformName in src/config/brand.ts. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#10182c"/>
      <stop offset="100%" stop-color="#1a2444"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text id="wordmark" x="600" y="212" font-family="Syne, sans-serif" font-weight="800" font-size="124" fill="#ffffff" text-anchor="middle" letter-spacing="8">GALAXY</text>
  <text x="600" y="282" font-family="Hanken Grotesk, sans-serif" font-weight="600" font-size="46" fill="url(#gold)" text-anchor="middle" letter-spacing="14">FINANCIAL</text>

  <text x="600" y="378" font-family="Hanken Grotesk, sans-serif" font-weight="700" font-size="40" fill="#e5e7eb" text-anchor="middle">Build Your Empire.</text>
  <text x="600" y="428" font-family="Hanken Grotesk, sans-serif" font-weight="400" font-size="28" fill="#94a3b8" text-anchor="middle">Uncapped commissions • Warm leads • Free training</text>

  <rect id="cta-pill" x="320" y="470" width="560" height="80" rx="40" fill="url(#gold)"/>
  <text id="cta-text" x="600" y="521" font-family="Hanken Grotesk, sans-serif" font-weight="800" font-size="30" fill="#0b1220" text-anchor="middle" letter-spacing="2">START YOUR APPLICATION</text>

  <text x="600" y="600" font-family="Hanken Grotesk, sans-serif" font-weight="500" font-size="18" fill="#64748b" text-anchor="middle" letter-spacing="3">HOLD THE STANDARD · AVERAGE IS THE DISEASE</text>
</svg>
